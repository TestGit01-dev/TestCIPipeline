name: Android CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

# Cancel superseded runs on the same PR/branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # This job name is the status check that branch protection requires.
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs Gradle and caches ~/.gradle (dependencies, wrapper, build cache)
      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Lint
        run: gradle lintDebug --stacktrace

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Debug build
        run: gradle assembleDebug --stacktrace

      - name: Upload reports and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
